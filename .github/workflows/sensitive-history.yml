name: Sensitive history

# Scans every fork commit, not only a pushed range, so the whole published
# history is checked against the current rules and private terms.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  sensitive-history:
    name: sensitive-history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Commits reachable from upstream/main are upstream's own and skipped.
      - name: Fetch upstream
        env:
          UPSTREAM_URL: https://github.com/convex/prosemirror-sync.git
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

      - name: Scan every fork commit
        env:
          SENSITIVE_TERMS_REQUIRED: "1"
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: scripts/check-sensitive.sh history
