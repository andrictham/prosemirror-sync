name: Sensitive content

# Each run scans only its own pushed range, so a cancelled run would leave
# that range unscanned. Never cancel a run in progress. GitHub also cancels a
# pending run when a newer one joins its group, so group by commit rather than
# by branch: only a repeat run for the same commit and event waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches-ignore: ["artifacts/**"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  sensitive-content:
    name: sensitive-content
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Test the scanner
        run: scripts/check-sensitive.test.sh

      # Only the pushed range is scanned, so older history does not fail
      # every run. Private terms come from a secret, or a variable when no
      # secret is set; without either, only generic patterns are checked.
      - name: Scan the pushed range
        env:
          SENSITIVE_TERMS:
            ${{ secrets.SENSITIVE_TERMS || vars.SENSITIVE_TERMS }}
          BASE:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: scripts/check-sensitive.sh range "$BASE" "$HEAD" "$BRANCH"
