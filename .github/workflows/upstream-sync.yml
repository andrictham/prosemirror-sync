name: Sync upstream releases
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
concurrency:
  group: upstream-sync
  cancel-in-progress: false
permissions: {}
env:
  BRANCH: upstream-sync
jobs:
  # Merges and runs upstream's install, tests and build with no token, since
  # that code comes from a tree upstream controls. Hands the result to the
  # publish job as a workflow artifact.
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    env:
      UPSTREAM_URL: https://github.com/convex/prosemirror-sync.git
    outputs:
      skip: ${{ steps.merge.outputs.skip }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
      version: ${{ steps.merge.outputs.version }}
      head: ${{ steps.merge.outputs.head }}
      failed: ${{ steps.verify.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - run: npm install --global npm@11.19.0
      - name: Merge main and upstream into the bot branch
        id: merge
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          git fetch --no-tags origin
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already contains upstream/main; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A long-lived branch: continue it, never recreate or rewrite it.
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            git switch -c "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH" origin/main
          fi
          out="$RUNNER_TEMP/sync"
          mkdir -p "$out"
          log="$out/merge.log"
          : > "$log"
          for source in origin/main upstream/main; do
            if git merge --no-ff --no-edit "$source" >> "$log" 2>&1; then
              echo "Merged $source cleanly." >> "$log"
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              printf 'Conflicts merging %s:\n%s\n' "$source" "$conflicts" >> "$log"
              # Commit the markers so the pull request shows the conflict.
              git add -A
              git commit --no-edit -m "Merge $source with unresolved conflicts" \
                -m "Resolve the committed conflict markers on $BRANCH before merging." \
                -m "Conflicted files:" -m "$conflicts"
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
            fi
          done
          # Bundle the branch before any upstream code runs.
          git bundle create "$out/branch.bundle" HEAD
          # Step outputs are fixed when this step ends, so later upstream code
          # cannot change the commit that publish checks the bundle against.
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(git show upstream/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install, test and build
        id: verify
        if: steps.merge.outputs.skip != 'true'
        run: |
          results="$RUNNER_TEMP/sync/results.md"
          : > "$results"
          failed=false
          for step in "npm ci --ignore-scripts" "npm test" "npm run build:artifact"; do
            if bash -c "$step" > "$RUNNER_TEMP/step.log" 2>&1; then
              status=passed
            else
              status=failed
              failed=true
            fi
            {
              echo "### \`$step\`: $status"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/step.log"
              echo '```'
              echo
            } >> "$results"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Upload the merged branch and logs
        if: steps.merge.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          retention-days: 1

  # Runs no repository code. The token reaches only the push and pull-request
  # step.
  publish:
    needs: merge-and-verify
    if: needs.merge-and-verify.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/sync
      - name: Push the bot branch and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.merge-and-verify.outputs.version }}
          EXPECTED_HEAD: ${{ needs.merge-and-verify.outputs.head }}
        run: |
          sync="$RUNNER_TEMP/sync"
          git init -q "$RUNNER_TEMP/push"
          cd "$RUNNER_TEMP/push"
          git fetch -q "$sync/branch.bundle" "HEAD:refs/heads/$BRANCH"
          if [ "$(git rev-parse "refs/heads/$BRANCH")" != "$EXPECTED_HEAD" ]; then
            echo "The bundle does not match the merged commit; refusing to push." >&2
            exit 1
          fi
          gh auth setup-git
          # Ordinary push only: the branch only ever gains merge commits.
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Merges \`main\` and then upstream \`main\` into \`$BRANCH\`. Review and merge by hand; this workflow never merges."
            echo
            echo "## Merge"
            echo
            echo '```'
            cat "$sync/merge.log"
            echo '```'
            echo
            echo "## Checks"
            echo
            cat "$sync/results.md"
          } > "$body"
          title="Merge upstream $VERSION"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "$title" --body-file "$body"
          fi
      - name: Fail when the merge or checks failed
        if:
          needs.merge-and-verify.outputs.conflicts == 'true' ||
          needs.merge-and-verify.outputs.failed == 'true'
        run: |
          echo "Merge conflicts or failed checks; see the pull request."
          exit 1
